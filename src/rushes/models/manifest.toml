# Fields: file (path under paths.cache_models), url, sha256 and bytes (of that file), license.
# Archive members add archive_member (path inside the archive), archive_sha256 and archive_bytes
# (of the whole archive: size bound of the download, hash checked before any extraction); `url` is
# then the archive URL.
#
# Sources, read once on 2026-11-10 (the only network pass; sha256 computed locally):
# - Hugging Face files are pinned on the full commit (`/resolve/<commit>/...`), resolved through
#   `/api/models/<repo>/revision/<short commit>`. LFS files: sha256 and size come from the API
#   (`lfs.oid`, `size`) and match docs/decisions.md (task 42 table, identical on Mac and server).
#   Small files (config.json, tokenizer.json, vocabulary.txt) were downloaded and hashed; their
#   byte counts match the API sizes.
