#   {max_downloads_per_run: 6, stock_days_target: 14, est_post_s: 90,
#    community_max_per_series: 5, max_height: 1080}
ntfy: {url: "https://ntfy.<domaine>", topic_env: NTFY_TOPIC, token_env: NTFY_TOKEN}
