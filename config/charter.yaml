# Charte graphique par marque (L35) : polices, couleurs, marges sûres et textes de l'habillage.
# Polices : dossier src/rushes/assets/fonts/ ; avatars : config/avatars/<marque>.png.
# Gabarits (str.format) : banner {title} {n} ; next_part {n} ; last_part {other} ; follow, subscribe : aucun.
saturday_toons:
  font: LuckiestGuy-Regular.ttf
  banner_bg: "#3B1F0E"
  banner_fg: "#FFF4DC"
  highlight: "#FFB627"
  progress: "#FF6B35"
  copy:
    en:
      banner: "{title} — Part {n}"
      next_part: "Part {n} next"
      last_part: "Watch {other} next"
      follow: "Follow for more"
      subscribe: "Follow"
