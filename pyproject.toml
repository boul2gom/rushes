[project]
name = "rushes"
version = "0.1.0"
description = "Pipeline personnel et autonome de vidéos courtes (cartoons et créateurs) pour TikTok et Instagram."
readme = "CLAUDE.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer>=0.27.3,<0.28",
    "rich>=15.0.0,<16",
    "pydantic>=2.14.2,<3",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20.1,<2",
    "numpy>=2.5.4,<3",
    "scipy>=1.18.1,<2",
    "pillow>=13.0.0,<14",
    "fonttools>=4.68.0,<5",
    "imagehash>=4.3.2,<5",
    "jinja2>=3.1.6,<4",
    "rapidfuzz>=3.14.6,<4",
    "opencv-contrib-python-headless>=5.0.0.93,<6",
    "scenedetect-headless==0.7.2",
    "torch>=2.15.0,<3",
    # direct so that [tool.uv.sources] applies: the PyPI Linux wheel is built for CUDA (libcudart)
    "torchvision>=0.29.2,<0.30",
    "open-clip-torch>=3.3.0,<4",
    "silero-vad>=6.2.3,<7",
    "faster-whisper>=1.2.1,<2",
    "sherpa-onnx>=2.0.1,<3",
    # holds libonnxruntime for sherpa-onnx; the 3.14 lock once dropped it (import failed): re-test before removing
    "sherpa-onnx-core>=2.0.1,<3",
    "llama-cpp-python>=0.3.36,<0.4",
    "yt-dlp[curl-cffi,default]>=2026.10.26,<2028",
    "yt-dlp-ejs>=0.8.0,<0.9",
]

[project.scripts]
rushes = "rushes.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.1,<3",
    "pre-commit>=4.7.0,<5",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    # scenedetect-headless wants it, but it overwrites cv2/ of opencv-contrib-python-headless,
    # our only cv2 provider; the marker is never true, so it is never installed
    "opencv-python-headless; python_version < '3'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests lents, exclus par défaut avec -m 'not slow'"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs"]  # plan code blocks are sketches, not source

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rushes.core.*", "rushes.db.*"]
strict = true

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true  # fontTools ships no type information

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true  # no stubs (scipy-stubs is not a dependency)

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true  # no stubs shipped (types-yt-dlp is not a dependency)

[[tool.mypy.overrides]]
module = ["scenedetect", "scenedetect.*", "silero_vad", "silero_vad.*", "open_clip", "open_clip.*", "sherpa_onnx", "sherpa_onnx.*"]
ignore_missing_imports = true  # no stubs and no py.typed marker
