[project]
name = "rushes"
version = "0.1.0"
description = "Pipeline personnel et autonome de vidéos courtes (cartoons et créateurs) pour TikTok et Instagram."
readme = "CLAUDE.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "typer>=0.27.3,<0.28",
    "rich>=15.0.0,<16",
    "pydantic>=2.14.2,<3",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20.1,<2",
]

[project.scripts]
rushes = "rushes.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.1,<3",
    "pre-commit>=4.7.0,<5",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests lents, exclus par défaut avec -m 'not slow'"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]
extend-exclude = ["docs"]  # plan code blocks are sketches, not source

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rushes.core.*", "rushes.db.*"]
strict = true
